name: Repo Visualizer

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  visualize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generar diagrama
        uses: githubocto/repo-visualizer@main
        with:
          output_file: "docs/diagram.svg"
          excluded_paths: "node_modules,dist,.git,.github"
          max_depth: 4
          commit_message: "chore: actualizar diagrama del repo [skip ci]"
